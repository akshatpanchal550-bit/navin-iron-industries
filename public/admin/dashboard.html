<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Navin Iron Industries</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="admin-shell">

<div class="admin-topbar">
  <span class="b1">NAVIN IRON — ADMIN</span>
  <div style="display:flex;align-items:center;gap:16px;">
    <span id="whoami" style="font-family:var(--mono);font-size:12.5px;color:rgba(255,255,255,0.7);"></span>
    <a href="../index.html" style="font-size:13px;color:rgba(255,255,255,0.8);">View Site</a>
    <button id="logoutBtn" class="btn btn-ghost-dark" style="padding:8px 16px;font-size:13px;">Log Out</button>
  </div>
</div>

<div class="admin-wrap">
  <div class="admin-card">
    <h2 style="font-size:19px;margin-bottom:6px;">Upload a new product photo</h2>
    <p style="margin-bottom:20px;">This appears on the Home and Services pages right away.</p>
    <form id="uploadForm" style="display:flex;flex-direction:column;gap:16px;max-width:480px;">
      <div class="field">
        <label>Title</label>
        <input type="text" name="title" required placeholder="e.g. Custom Staircase Railing">
      </div>
      <div class="field">
        <label>Category</label>
        <select name="category">
          <option value="Metal Fabrication">Metal Fabrication</option>
          <option value="Laser Cutting">Laser Cutting</option>
          <option value="CNC Cutting">CNC Cutting</option>
          <option value="Welding">Welding</option>
          <option value="Sheet Metal Work">Sheet Metal Work</option>
          <option value="Custom Fabrication">Custom Fabrication</option>
          <option value="Gates">Gates</option>
          <option value="Railings">Railings</option>
        </select>
      </div>
      <div class="field">
        <label>Description (optional)</label>
        <textarea name="description" rows="3"></textarea>
      </div>
      <div class="field">
        <label>Photo</label>
        <input type="file" name="image" accept="image/*" required>
      </div>
      <div id="uploadMsg" class="form-msg"></div>
      <button type="submit" class="btn btn-primary" id="uploadBtn" style="align-self:flex-start;">Upload</button>
    </form>
  </div>

  <div class="admin-card">
    <h2 style="font-size:19px;margin-bottom:20px;">Current photos</h2>
    <div class="admin-grid" id="productList">
      <p>Loading…</p>
    </div>
  </div>
</div>

<script>
  async function requireLogin() {
    const res = await fetch('/api/auth/me');
    if (!res.ok) { window.location.href = 'login.html'; return; }
    const body = await res.json();
    document.getElementById('whoami').textContent = body.email;
  }

  async function loadProducts() {
    const list = document.getElementById('productList');
    const res = await fetch('/api/products');
    const products = await res.json();
    if (!products.length) {
      list.innerHTML = '<p>No photos uploaded yet.</p>';
      return;
    }
    list.innerHTML = products.map(p => `
      <div class="admin-product" data-id="${p.id}">
        <img src="${p.image_path}" alt="${p.title}">
        <div class="p-body">
          <h4>${p.title}</h4>
          <div style="font-family:var(--mono);font-size:11px;color:var(--steel-light);">${p.category || ''}</div>
          <div class="p-actions">
            <button class="danger" data-action="delete" data-id="${p.id}">Delete</button>
          </div>
        </div>
      </div>
    `).join('');

    list.querySelectorAll('[data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this photo?')) return;
        await fetch('/api/products/' + btn.dataset.id, { method: 'DELETE' });
        loadProducts();
      });
    });
  }

  document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = document.getElementById('uploadBtn');
    const msg = document.getElementById('uploadMsg');
    btn.disabled = true;
    btn.textContent = 'Uploading…';
    try {
      const res = await fetch('/api/products', { method: 'POST', body: new FormData(form) });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || 'Upload failed');
      msg.textContent = 'Photo uploaded.';
      msg.className = 'form-msg ok show';
      form.reset();
      loadProducts();
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'form-msg err show';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Upload';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.href = 'login.html';
  });

  requireLogin();
  loadProducts();
</script>
</body>
</html>
